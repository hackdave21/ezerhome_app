# Ezer Home - Staging (HTTP initial, avant obtention du certificat)
# Remplacer staging.ezerhome.org par le domaine reel.
# Ce fichier sert uniquement a valider le domaine et a obtenir le certificat.

server {
    listen 80;
    listen [::]:80;
    server_name staging.ezerhome.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
