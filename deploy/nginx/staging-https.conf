# Ezer Home - Staging (HTTPS + protection Basic Auth)
# Remplacer staging.ezerhome.org par le domaine reel.
# Le fichier .htpasswd est cree par deploy/scripts/setup-staging.sh.

server {
    listen 80;
    listen [::]:80;
    server_name staging.ezerhome.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.ezerhome.org;

    root /var/www/ezer-home/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/staging.ezerhome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ezerhome.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Protection de l'environnement de recette
    auth_basic           "Ezer Home - Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Laisse passer le renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
