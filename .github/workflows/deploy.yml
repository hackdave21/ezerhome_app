name: Deploiement production (Hostinger)

on:
  # Ne deploie qu'apres une CI verte sur main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Permet de relancer un deploiement manuellement depuis l'onglet Actions.
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploiement production
    runs-on: ubuntu-latest
    environment: production

    # Sur workflow_run : uniquement si la CI est verte sur main.
    # Sur workflow_dispatch : toujours.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Installer les dependances Composer (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Compiler les assets frontend (Vite)
        run: |
          npm ci
          npm run build

      - name: Preparer la cle SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT || 22 }}" -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Synchroniser l'application par rsync vers Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $HOSTINGER_PORT" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage/*.key' \
            --exclude='storage/app/exports/*' \
            --exclude='storage/app/medias/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='node_modules' \
            --exclude='tests' \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_APP_DIR/"

      - name: Finaliser le deploiement sur le serveur Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "APP_DIR='$HOSTINGER_APP_DIR' bash -s" \
            < deploy/scripts/deploy-production.sh

      - name: Verifier la disponibilite
        if: success()
        env:
          APP_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            curl --fail --silent --show-error --retry 5 --retry-delay 10 "$APP_URL" > /dev/null
          else
            echo "PRODUCTION_URL non defini : verification HTTP ignoree."
          fi

